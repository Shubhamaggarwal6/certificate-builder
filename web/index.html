<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificate Maker</title>
  <style>
    :root { color-scheme: light; --ink:#182333; --muted:#64748b; --line:#dbe2ea; --blue:#2158a5; --pale:#f5f8fc; }
    * { box-sizing:border-box }
    body { margin:0; background:var(--pale); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif }
    main { width:min(900px,calc(100% - 32px)); margin:42px auto }
    header { margin-bottom:24px }
    h1 { margin:0 0 6px; font-size:30px; letter-spacing:-.03em }
    h2 { margin:0 0 16px; font-size:19px }
    p { margin:0; color:var(--muted) }
    section { background:white; padding:24px; border:1px solid var(--line); border-radius:14px; margin:16px 0; box-shadow:0 4px 16px #18233308 }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px }
    label { display:block; font-weight:600; font-size:14px; margin-bottom:6px }
    input { width:100%; padding:11px 12px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; color:var(--ink); background:#fff }
    input:focus { outline:3px solid #2158a522; border-color:var(--blue) }
    table { width:100%; border-collapse:collapse; margin:14px 0 10px }
    th { text-align:left; color:var(--muted); font-size:13px; font-weight:600; padding:8px 10px }
    td { border-top:1px solid var(--line); padding:10px }
    td:first-child, th:first-child { padding-left:0 }
    td:last-child, th:last-child { width:1%; white-space:nowrap; padding-right:0 }
    .bulk-choice { display:flex; flex-wrap:wrap; gap:12px; margin:8px 0 18px }
    .bulk-choice label { border:1px solid var(--line); border-radius:8px; padding:10px 13px; font-weight:500; cursor:pointer }
    .bulk-choice input { width:auto; margin:0 7px 0 0 }
    button { border:0; border-radius:8px; padding:11px 16px; font:600 15px system-ui; cursor:pointer }
    button:disabled { opacity:.6; cursor:wait }
    .primary { background:var(--blue); color:#fff }
    .secondary { background:#edf2f8; color:var(--ink) }
    .remove { background:transparent; color:#a12b35; padding:10px }
    .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center }
    #message { margin:14px 0 0; color:var(--muted) }
    #results { display:grid; gap:9px; margin-top:16px }
    .result { padding:12px 14px; border:1px solid var(--line); border-radius:8px; display:flex; justify-content:space-between; gap:12px; align-items:center }
    .result a { color:var(--blue); font-weight:600; white-space:nowrap }
    .error { color:#a12b35 }
    .hint { font-size:13px; margin-top:4px }
    @media(max-width:650px) { main { margin:24px auto } section { padding:18px } .grid { grid-template-columns:1fr } td { padding:8px 5px } td input { padding:9px 7px; min-width:0 } .remove { padding:6px } .result { align-items:flex-start; flex-direction:column } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Certificate Maker</h1>
    <p>Enter the certificate details and recipients. We’ll create one certificate for each person.</p>
  </header>
  <form id="form">
    <section>
      <h2>Certificate details</h2>
      <div class="grid">
        <div><label for="title">Course or event name</label><input id="title" required maxlength="200" placeholder="e.g. First Aid Training"></div>
        <div><label for="issuer">Organization issuing the certificate</label><input id="issuer" required maxlength="160" placeholder="e.g. Community Learning Center"></div>
        <div><label for="issued_on">Date issued</label><input id="issued_on" type="date" required></div>
      </div>
    </section>
    <section>
      <h2>People receiving certificates</h2>
      <p>Are these certificates for more than one person?</p>
      <div class="bulk-choice">
        <label><input type="radio" name="bulk" value="yes" required>Yes, multiple people</label>
        <label><input type="radio" name="bulk" value="no" required>No, one person</label>
      </div>
      <table>
        <thead><tr><th><label for="first-name">Full name</label></th><th><label for="first-email">Email address</label></th><th></th></tr></thead>
        <tbody id="recipients"></tbody>
      </table>
      <button class="secondary" type="button" id="add" hidden>+ Add another person</button>
    </section>
    <section>
      <div class="actions"><button class="primary" id="submit" type="submit">Create certificates</button><span id="count"></span></div>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="results"></div>
    </section>
  </form>
</main>
<script>
  const list = document.querySelector('#recipients');
  const message = document.querySelector('#message');
  const results = document.querySelector('#results');
  const submit = document.querySelector('#submit');
  const count = document.querySelector('#count');
  function updateCount() { count.textContent = `${list.children.length} person${list.children.length === 1 ? '' : 's'}`; }
  function addRecipient(name = '', email = '') {
    if (list.children.length >= 5000) return;
    const row = document.createElement('tr');
    row.innerHTML = `<td><input ${list.children.length === 0 ? 'id="first-name"' : ''} name="recipient_name" aria-label="Full name" required maxlength="160" placeholder="Full name"></td><td><input ${list.children.length === 0 ? 'id="first-email"' : ''} name="recipient_email" type="email" aria-label="Email address" required placeholder="name@example.com"></td><td><button class="remove" type="button" aria-label="Remove person">Remove</button></td>`;
    row.querySelector('[name=recipient_name]').value = name;
    row.querySelector('[name=recipient_email]').value = email;
    row.querySelector('.remove').addEventListener('click', () => { if (list.children.length > 1) { row.remove(); setBulkMode(document.querySelector('input[name="bulk"]:checked')?.value); } });
    list.append(row); updateCount();
  }
  const addButton = document.querySelector('#add');
  function setBulkMode(value) {
    addButton.hidden = value !== 'yes';
    for (const row of list.children) row.querySelector('.remove').hidden = value !== 'yes' || list.children.length === 1;
    if (value === 'no') while (list.children.length > 1) list.lastElementChild.remove();
    updateCount();
  }
  document.querySelectorAll('input[name="bulk"]').forEach(input => input.addEventListener('change', event => setBulkMode(event.target.value)));
  addButton.addEventListener('click', () => { addRecipient(); setBulkMode('yes'); });
  addRecipient();
  document.querySelector('#issued_on').value = new Date().toISOString().slice(0, 10);
  function showResults(job) {
    results.replaceChildren();
    for (const person of job.recipients) {
      const card = document.createElement('div'); card.className = 'result';
      const label = document.createElement('span'); label.textContent = person.status === 'failed' ? `${person.name} — Could not create: ${person.error}` : `${person.name} — Ready`;
      if (person.status === 'failed') label.className = 'error';
      card.append(label);
      if (person.status === 'succeeded') {
        const link = document.createElement('a'); link.textContent = 'Download PDF'; link.href = `/jobs/${job.id}/certificates/${person.id}`; link.download = `certificate-${person.id}.pdf`; card.append(link);
      }
      results.append(card);
    }
  }
  async function waitForJob(id) {
    for (;;) {
      const response = await fetch(`/jobs/${id}`);
      if (!response.ok) throw new Error('Could not check generation progress.');
      const job = await response.json();
      message.textContent = `Creating certificates: ${job.progress.processed} of ${job.progress.total} finished.`;
      showResults(job);
      if (job.status === 'completed' || job.status === 'completed_with_errors') {
        message.textContent = job.progress.failed ? `Finished. ${job.progress.succeeded} ready; ${job.progress.failed} could not be created.` : `Done! All ${job.progress.succeeded} certificates are ready to download.`;
        return;
      }
      await new Promise(resolve => setTimeout(resolve, 900));
    }
  }
  document.querySelector('#form').addEventListener('submit', async event => {
    event.preventDefault(); results.replaceChildren(); message.textContent = '';
    const recipients = [...list.children].map(row => ({
      name: row.querySelector('[name=recipient_name]').value.trim(),
      email: row.querySelector('[name=recipient_email]').value.trim()
    }));
    if (recipients.length > 5000) { message.textContent = 'Please submit a smaller group at a time.'; return; }
    submit.disabled = true;
    try {
      message.textContent = 'Starting…';
      const response = await fetch('/jobs', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
        title:document.querySelector('#title').value.trim(), issuer:document.querySelector('#issuer').value.trim(),
        issued_on:document.querySelector('#issued_on').value, recipients
      })});
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail?.map?.(e => e.msg).join(', ') || data.detail || 'Please check the information and try again.');
      await waitForJob(data.id);
    } catch (error) { message.textContent = error.message || 'Something went wrong. Please try again.'; message.className = 'error'; }
    finally { submit.disabled = false; }
  });
</script>
</body>
</html>
